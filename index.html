<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket Booking Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #273c75;
            color: white;
            text-align: center;
            padding: 20px;
        }
        main {
            max-width: 800px;
            margin: 30px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #192a56;
        }
        form label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        form input, form select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 20px;
            background-color: #44bd32;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #4cd137;
        }
        footer {
            text-align: center;
            background-color: #2f3640;
            color: white;
            padding: 10px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>Event Ticket Booking</h1>
    <p>Book your tickets easily and securely 🎟️</p>
</header>

<main>
    <h2>Booking Form</h2>
    <form>
        <!-- Event Selection -->
        <label for="event">Select Event:</label>
        <select id="event" name="event">
            <option value="concert">Music Concert</option>
            <option value="movie">Movie Show</option>
            <option value="sports">Sports Match</option>
        </select>

        <!-- User Information -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" placeholder="Enter your phone number">

        <!-- Ticket Details -->
        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" min="1" max="10" value="1">

        <label for="date">Event Date:</label>
        <input type="date" id="date">

        <!-- Payment -->
        <label for="payment">Payment Method:</label>
        <select id="payment" name="payment">
            <option value="credit">Credit Card</option>
            <option value="debit">Debit Card</option>
            <option value="upi">UPI</option>
            <option value="netbanking">Net Banking</option>
        </select>

        <button type="submit">Book Tickets</button>
    </form>
</main>

<footer>
    <p>© 2026 Ticket Booking Application | All Rights Reserved</p>
</footer>

</body>
</html>
